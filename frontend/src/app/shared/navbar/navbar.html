<div class="navbar bg-base-100 shadow-sm">
  <div class="navbar-start">
    <a routerLink="/" class="btn btn-ghost text-xl font-medium">📚 Biblioteca Digital</a>
  </div>

  <div class="navbar-end gap-2">
    @if (authService.authStatus() === 'authenticated') {
      <span class="hidden sm:inline text-sm opacity-70">
        Hola, {{ authService.user()?.fullName }}
        @if (authService.isAdmin()) {
          <span class="badge badge-primary badge-sm ml-1">admin</span>
        }
      </span>
      <button type="button" class="btn btn-ghost btn-sm" (click)="authService.logout()">Cerrar sesión</button>
    } @else {
      <a routerLink="/auth/login" class="btn btn-sm">Iniciar sesión</a>
    }
  </div>
</div>
